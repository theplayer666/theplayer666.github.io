<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 让 iOS Safari 暴露 env(safe-area-inset-*)，
         配合 Layout Header 的安全区 padding 才能避免 PWA 状态栏遮挡。
         注意：去掉了 maximum-scale=1.0 + user-scalable=no（反 a11y，
         Apple 在 iOS 10+ 已明确建议不要禁用用户缩放）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="提示词库" />
    <title>提示词库</title>

    <!-- 标准图标：优先 SVG（可缩放），再回退 PNG -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    
    <!-- Android Chrome -->
    <link rel="manifest" href="./manifest.json" />
    
    <meta name="description" content="提示词库 - 高效管理和复用AI提示词" />

    <!-- 主题：首屏内联解析（浅色/暗色/跟随系统），避免 React 挂载前闪烁 -->
    <script>
      (function () {
        var mode = 'light';
        var glass = 'standard';
        try {
          var raw = localStorage.getItem('app-settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed) {
              if (
                parsed.themeMode === 'light' ||
                parsed.themeMode === 'dark' ||
                parsed.themeMode === 'system'
              ) {
                mode = parsed.themeMode;
              }
              if (
                parsed.glassOpacity === 'clear' ||
                parsed.glassOpacity === 'light' ||
                parsed.glassOpacity === 'standard' ||
                parsed.glassOpacity === 'solid'
              ) {
                glass = parsed.glassOpacity;
              }
            }
          }
        } catch (e) {
          /* localStorage 不可用时退回浅色 */
        }
        var resolved =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.glass = glass;
        root.style.colorScheme = resolved;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = resolved === 'dark' ? '#1c1c1e' : '#f2f2f7';
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BOqaMb8U.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BNlr_bYI.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
