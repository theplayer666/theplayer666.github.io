<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8ff" />
    <link rel="icon" href="data:," />
    <title>识字小镇 · Character Town</title>
    <script type="module" crossorigin src="/assets/index-DwKI44O6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CIDDuArJ.css">
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="识字小镇 Three.js 游戏画布"></canvas>

      <!-- 顶部：图片提示 + 拼音 + 词语 -->
      <section id="prompt-card" aria-live="polite">
        <div id="prompt-picture" aria-hidden="true">🌙</div>
        <div id="prompt-text">
          <div id="prompt-pinyin">yuè</div>
          <div id="prompt-word">
            <span class="char-slot" data-slot="0">?</span>
          </div>
        </div>
      </section>

      <!-- 关卡进度 + 鼓励语 -->
      <section id="round-bar" aria-live="polite">
        <div id="round-dots" aria-label="关卡进度"></div>
        <div id="status-line">准备好啦！走向正确的汉字 ✨</div>
      </section>

      <!-- 游戏中右上方：返回关卡列表（左）+ 换装（右） -->
      <button id="back-fab" type="button" aria-label="返回关卡选择" hidden>
        <span class="back-fab-icon" aria-hidden="true">🏠</span>
        <span class="back-fab-label">关卡</span>
      </button>

      <!-- 始终可见的换装入口：放在右上方，游戏过程中也能用 -->
      <button id="outfit-fab" type="button" aria-label="打开换装">
        <span class="outfit-fab-icon" aria-hidden="true">👗</span>
        <span class="outfit-fab-label">换装</span>
      </button>

      <!-- 开始 / 结束 弹窗。初始隐藏，等 Game.start() 加载完 stages.json 后再显示。 -->
      <section id="overlay">
        <div id="overlay-card">
          <h1 id="overlay-title">识字小镇</h1>
          <p id="overlay-body">正在准备关卡…</p>
          <div id="overlay-extras"></div>
          <button id="overlay-button" type="button">开始游戏</button>
          <button id="overlay-secondary" type="button" hidden>选择其他关卡</button>
        </div>
      </section>

      <!-- 触屏移动 -->
      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <!-- 占位按钮（保持 InputController 依赖；触屏上隐藏） -->
        <button id="dash-button" type="button" tabindex="-1" aria-hidden="true"></button>
      </div>

      <!-- 移动端首次进入提示 -->
      <section id="mobile-hint" aria-live="polite">
        <div class="hint-card">
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">🕹️</span>
            <span class="hint-text">推动左下摇杆，让小兔子走动</span>
          </div>
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">👆</span>
            <span class="hint-text">在场景上滑动手指，可以转动视角</span>
          </div>
          <button id="mobile-hint-close" type="button">知道了</button>
        </div>
        <div class="hint-arrow" aria-hidden="true">↙</div>
      </section>

      <!-- 手柄首次连接提示：与移动端 hint 类似，列出手柄按键映射 -->
      <section id="gamepad-hint" aria-live="polite">
        <div class="hint-card gp-hint-card">
          <div class="gp-hint-title">🎮 手柄已连接</div>
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">🕹️</span>
            <span class="hint-text">左摇杆：移动 · 右摇杆：转动视角</span>
          </div>
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">🅰️</span>
            <span class="hint-text">A 键：进入 / 确认 · B 键：返回</span>
          </div>
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">🔼</span>
            <span class="hint-text">方向键：选择关卡 / 服装</span>
          </div>
          <div class="hint-row">
            <span class="hint-icon" aria-hidden="true">🟡</span>
            <span class="hint-text">Y 键：换装 · Start：朗读字音</span>
          </div>
          <button id="gamepad-hint-close" type="button">知道了</button>
        </div>
      </section>
    </main>
  </body>
</html>
